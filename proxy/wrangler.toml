# Cloudflare Worker config. Holds no secrets: the API key is set with
# `npx wrangler secret put ANTHROPIC_API_KEY` (see proxy/README.md).
name = "tarot-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Comma-separated origins allowed to call the proxy. Replace with the real site.
ALLOWED_ORIGINS = "https://OWNER.github.io"

# Paid upstream calls allowed per UTC day. Counted in the CACHE namespace.
DAILY_CEILING = "1000"

# Required. Without these two the Worker refuses every request (a missing
# shield must not mean no shield). For local work only, put
# ALLOW_NO_RATE_LIMIT=true in proxy/.dev.vars.

# Reading cache and daily counter (create once:
# `npx wrangler kv namespace create CACHE`, then paste the id).
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<namespace id>"

# Soft per-client rate limit; see the notes in proxy/README.md.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
