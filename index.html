<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply a saved theme before first paint so there is no flash. Keep the
      // key in step with THEME_KEY in src/ui/theme.ts.
      try {
        var t = localStorage.getItem('tarot.theme.v1');
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarot</title>
    <meta
      name="description"
      content="Lay out tarot cards and read them: deal a spread or enter your own cards. Each card is read in its position and against the others. For reflection, not prediction or advice."
    />
    <meta
      name="theme-color"
      content="#f6f0e4"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14101c"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tarot" />
    <meta
      property="og:description"
      content="Deal a spread or enter your own cards, and read each card in its position and against the others. For reflection, not prediction or advice."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
